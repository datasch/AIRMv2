version: '3.8'
services:
  rails:
    image: 'ghcr.io/datasch/airm:latest'
    restart: always
    entrypoint:
      - sh
      - docker/entrypoints/rails.sh
    command: ["sh", "-c", "mkdir -p tmp/pids && rm -f tmp/pids/server.pid && bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3000"]
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - 'BUNDLE_WITHOUT=development:test'
      - BUNDLE_PATH=/gems
      - BUNDLE_FORCE_RUBY_PLATFORM=1
      - EXECJS_RUNTIME=Disabled
      - RAILS_SERVE_STATIC_FILES=true
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE:-f89b0c8ca72e50112353e8fc153b43a24fc1656cf2492266a5de8ae5374e29d93709bd07ab5fee72bb364f41f00af21967656a66d88341bf9abd9138c40e332d}'
      - 'FRONTEND_URL=${FRONTEND_URL:-https://airm.giantucchi.com}'
      - 'HELPCENTER_URL=${HELPCENTER_URL:-}'
      - 'POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}'
      - POSTGRES_HOST=airm_postgres
      - POSTGRES_PORT=5432
      - 'POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}'
      - 'EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}'
      - 'EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-evolution_secret_key_2026}'
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - 'ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-d0fbefd4b17eac815e2ac70cf26b4dea}'
      - 'ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-bd6f095c423938798a37f03f010d48f9}'
      - 'ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-9d9aeb46b718bb12080d942bba86db81}'
      - 'MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-AIRM <soporte@giantucchi.com>}'
      - 'SMTP_ADDRESS=${SMTP_ADDRESS:-}'
      - 'SMTP_PORT=${SMTP_PORT:-587}'
      - 'SMTP_USERNAME=${SMTP_USERNAME:-}'
      - 'SMTP_PASSWORD=${SMTP_PASSWORD:-}'
      - 'SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION:-plain}'
      - 'SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}'
    volumes:
      - 'storage_data:/app/storage'
    depends_on:
      airm_postgres:
        condition: service_healthy
      airm_redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider http://127.0.0.1:3000/health || exit 1'
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
  sidekiq:
    image: 'ghcr.io/datasch/airm:latest'
    restart: always
    entrypoint:
      - sh
      - docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - sidekiq
      - '-C'
      - config/sidekiq.yml
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - INSTALLATION_ENV=docker
      - 'BUNDLE_WITHOUT=development:test'
      - BUNDLE_PATH=/gems
      - BUNDLE_FORCE_RUBY_PLATFORM=1
      - EXECJS_RUNTIME=Disabled
      - 'SECRET_KEY_BASE=${SECRET_KEY_BASE:-f89b0c8ca72e50112353e8fc153b43a24fc1656cf2492266a5de8ae5374e29d93709bd07ab5fee72bb364f41f00af21967656a66d88341bf9abd9138c40e332d}'
      - 'FRONTEND_URL=${FRONTEND_URL:-https://airm.giantucchi.com}'
      - 'POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}'
      - POSTGRES_HOST=airm_postgres
      - POSTGRES_PORT=5432
      - 'POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}'
      - 'EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}'
      - 'EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-evolution_secret_key_2026}'
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
      - 'ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-d0fbefd4b17eac815e2ac70cf26b4dea}'
      - 'ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-bd6f095c423938798a37f03f010d48f9}'
      - 'ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-9d9aeb46b718bb12080d942bba86db81}'
    volumes:
      - 'storage_data:/app/storage'
    depends_on:
      airm_postgres:
        condition: service_healthy
      airm_redis:
        condition: service_healthy
  evolution-api:
    image: 'evoapicloud/evolution-api:v2.2.3'
    restart: always
    ports:
      - '8080:8080'
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - 'AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-airm_evolution_secret_api_key_2026}'
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - 'DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:-postgres}@airm_postgres:5432/${POSTGRES_DATABASE:-chatwoot_production}?sslmode=disable'
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_chatwoot
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=true
      - 'CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-redispassword}@airm_redis:6379/1'
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CHATWOOT_ENABLED=true
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - WA_BUSINESS_TOKEN_WEBHOOK=true
      - 'LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS'
      - 'CORS_ORIGIN=*'
    volumes:
      - 'evolution_instances_data:/evolution/instances'
    depends_on:
      airm_postgres:
        condition: service_healthy
      airm_redis:
        condition: service_healthy
  airm_postgres:
    image: 'pgvector/pgvector:pg16'
    restart: always
    environment:
      - 'POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}'
      - 'POSTGRES_USER=${POSTGRES_USERNAME:-postgres}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}'
    volumes:
      - 'airm_postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DATABASE:-chatwoot_production}'
      interval: 10s
      timeout: 5s
      retries: 5
  airm_redis:
    image: 'redis:alpine'
    restart: always
    command:
      - redis-server
      - '--requirepass'
      - '${REDIS_PASSWORD:-redispassword}'
    volumes:
      - 'airm_redis_data:/data'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - '-a'
        - '${REDIS_PASSWORD:-redispassword}'
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  airm_postgres_data: null
  airm_redis_data: null
  storage_data: null
  evolution_instances_data: null
