; ====================================================================
; Asterisk Dialplan (extensions.conf) - AIRM VoIP Integration
; ====================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TRUNK_VOIPRABBIT=voiprabbit-endpoint
DEFAULT_CALLER_ID=51913086096
; Pool de números para rotación automática anti-spam (separados por coma).
; Agrega aquí tantos números como tengas en tu troncal: ej. 51913086096,51987654321,...
DID_POOL=51913086096

; --------------------------------------------------------------------
; Subrutina para seleccionar y rotar dinámicamente el Caller ID
; --------------------------------------------------------------------
[sub-apply-callerid]
exten => s,1,NoOp(Calculando Caller ID desde el pool de rotacion)
 same => n,Set(TOTAL_DIDS=${FIELDNUM(DID_POOL,\,)})
 same => n,ExecIf($[${TOTAL_DIDS} < 1]?Set(TOTAL_DIDS=1))
 same => n,Set(RAND_INDEX=${RAND(1,${TOTAL_DIDS})})
 same => n,Set(SELECTED_CID=${CUT(DID_POOL,\,,${RAND_INDEX})})
 same => n,ExecIf($[${LEN(${SELECTED_CID})} < 3]?Set(SELECTED_CID=${DEFAULT_CALLER_ID}))
 same => n,NoOp(Caller ID seleccionado para esta llamada: ${SELECTED_CID} [Indice ${RAND_INDEX} de ${TOTAL_DIDS}])
 same => n,Set(CALLERID(num)=${SELECTED_CID})
 same => n,Set(CALLERID(name)=${SELECTED_CID})
 same => n,Return()

; --------------------------------------------------------------------
; Subrutina para iniciar grabacion automatica de llamada
; --------------------------------------------------------------------
[sub-start-recording]
exten => s,1,NoOp(--- Iniciando grabacion automatica de llamada ---)
 same => n,Set(CALL_UUID=${PJSIP_HEADER(read,X-Call-ID)})
 same => n,ExecIf($[${LEN(${CALL_UUID})} < 3]?Set(CALL_UUID=${UNIQUEID}))
 same => n,Set(REC_FILE=/var/spool/asterisk/monitor/${CALL_UUID})
 same => n,NoOp(Archivo de grabacion: ${REC_FILE}.wav)
 same => n,MixMonitor(${REC_FILE}.wav,b)
 same => n,Return()

; --------------------------------------------------------------------
; Contexto para llamadas internas y salientes desde los agentes WebRTC
; --------------------------------------------------------------------
[from-internal]

; Llamadas entre extensiones internas (ej. 1001, 1011, 1012, etc.)
exten => _10XX,1,NoOp(Llamada interna de ${CALLERID(num)} a extension ${EXTEN})
 same => n,Gosub(sub-start-recording,s,1)
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Llamadas a números móviles de Perú (9 dígitos que inician con 9)
exten => _9XXXXXXXX,1,NoOp(Llamada saliente a celular Peru: ${EXTEN})
 same => n,Gosub(sub-apply-callerid,s,1)
 same => n,Gosub(sub-start-recording,s,1)
 same => n,Dial(PJSIP/51${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; Llamadas a números de Perú con prefijo de país 51 (11 dígitos que inician con 519)
exten => _519XXXXXXXX,1,NoOp(Llamada saliente con prefijo 51: ${EXTEN})
 same => n,Gosub(sub-apply-callerid,s,1)
 same => n,Gosub(sub-start-recording,s,1)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; Llamadas con signo '+' (ej. +51986371150)
exten => _+.,1,NoOp(Removiendo prefijo + de la llamada)
 same => n,Goto(from-internal,${EXTEN:1},1)

; Cualquier otro número internacional o formato general
exten => _X.,1,NoOp(Llamada saliente general: ${EXTEN})
 same => n,Gosub(sub-apply-callerid,s,1)
 same => n,Gosub(sub-start-recording,s,1)
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; --------------------------------------------------------------------
; Contexto para llamadas entrantes desde la troncal (si aplica)
; --------------------------------------------------------------------
[from-trunk]
exten => _.,1,NoOp(Llamada entrante desde VoIPRabbit a ${EXTEN})
 same => n,Gosub(sub-start-recording,s,1)
 same => n,Dial(PJSIP/1001,30,r)
 same => n,Hangup()
