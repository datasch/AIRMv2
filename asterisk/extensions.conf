; ====================================================================
; Asterisk Dialplan (extensions.conf) - AIRM VoIP Integration
; ====================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TRUNK_VOIPRABBIT=voiprabbit-endpoint
DEFAULT_CALLER_ID=51913086096

; --------------------------------------------------------------------
; Contexto para llamadas internas y salientes desde los agentes WebRTC
; --------------------------------------------------------------------
[from-internal]

; Llamadas entre extensiones internas (ej. 1001, 1011, 1012, etc.)
exten => _10XX,1,NoOp(Llamada interna de ${CALLERID(num)} a extension ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,r)
 same => n,Hangup()

; Llamadas a números móviles de Perú (9 dígitos que inician con 9)
exten => _9XXXXXXXX,1,NoOp(Llamada saliente a celular Peru: ${EXTEN})
 same => n,Set(CALLERID(num)=${DEFAULT_CALLER_ID})
 same => n,Set(CALLERID(name)=${DEFAULT_CALLER_ID})
 same => n,Dial(PJSIP/51${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; Llamadas a números de Perú con prefijo de país 51 (11 dígitos que inician con 519)
exten => _519XXXXXXXX,1,NoOp(Llamada saliente con prefijo 51: ${EXTEN})
 same => n,Set(CALLERID(num)=${DEFAULT_CALLER_ID})
 same => n,Set(CALLERID(name)=${DEFAULT_CALLER_ID})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; Llamadas con signo '+' (ej. +51986371150)
exten => _+.,1,NoOp(Removiendo prefijo + de la llamada)
 same => n,Goto(from-internal,${EXTEN:1},1)

; Cualquier otro número internacional o formato general
exten => _X.,1,NoOp(Llamada saliente general: ${EXTEN})
 same => n,Set(CALLERID(num)=${DEFAULT_CALLER_ID})
 same => n,Set(CALLERID(name)=${DEFAULT_CALLER_ID})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK_VOIPRABBIT},60,r)
 same => n,Hangup()

; --------------------------------------------------------------------
; Contexto para llamadas entrantes desde la troncal (si aplica)
; --------------------------------------------------------------------
[from-trunk]
exten => _.,1,NoOp(Llamada entrante desde VoIPRabbit a ${EXTEN})
 same => n,Dial(PJSIP/1001,30,r)
 same => n,Hangup()
