; ====================================================================
; Asterisk PJSIP Configuration - AIRM WebRTC & VoIPRabbit Trunk
; ====================================================================

[global]
type=global
user_agent=AIRM-Asterisk-PBX

; ====================================================================
; TRANSPORTES
; ====================================================================

; 1. Transporte WebSocket (WebRTC para navegadores de los agentes)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8089
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=95.216.197.185
external_signaling_address=95.216.197.185

; 2. Transporte SIP UDP estándar (Para conectar con VoIPRabbit)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=95.216.197.185
external_signaling_address=95.216.197.185

; ====================================================================
; TRONCAL SIP VOIPRABBIT (Autenticación por IP Autorizada)
; ====================================================================

[voiprabbit-endpoint]
type=endpoint
transport=transport-udp
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
allow=g729
aors=voiprabbit-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
send_pai=yes
send_rpid=yes
from_domain=149.20.185.4

[voiprabbit-aor]
type=aor
contact=sip:149.20.185.4:5060

[voiprabbit-identify]
type=identify
endpoint=voiprabbit-endpoint
match=149.20.185.4

; ====================================================================
; PLANTILLA BASE PARA AGENTES WEBRTC (Navegadores Chrome/Firefox)
; ====================================================================

[webrtc-endpoint](!)
type=endpoint
transport=transport-ws
context=from-internal
disallow=all
allow=opus
allow=ulaw
allow=alaw
dtls_auto_generate_cert=yes
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
direct_media=no

; ====================================================================
; EXTENSIONES DE AGENTES / VENDEDORES
; (Asegúrate de colocar la misma contraseña que pusiste en AIRM)
; ====================================================================

; --- Extensión 1001 (Giantucchi / Admin) ---
[1001](webrtc-endpoint)
auth=1001-auth
aors=1001-aor
callerid="Giantucchi" <1001>

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=Ventas2026*

[1001-aor]
type=aor
max_contacts=2
remove_existing=yes


