<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bg-grad-5)"/>
  <rect width="598" height="398" x="1" y="1" rx="15" fill="none" stroke="rgba(245, 158, 11, 0.35)" stroke-width="2"/>

  <circle cx="150" cy="180" r="120" fill="#f59e0b" opacity="0.12" filter="url(#glow-5)"/>
  <circle cx="450" cy="200" r="110" fill="#8b5cf6" opacity="0.12" filter="url(#glow-5)"/>

  <!-- Implementation Blueprint / Architecture Visual -->
  <g transform="translate(100, 60)">
    <rect width="400" height="240" rx="16" fill="#0c0e1c" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="400" height="34" rx="16" fill="#080913"/>
    <rect y="20" width="400" height="14" fill="#080913"/>
    <circle cx="20" cy="17" r="4" fill="#f59e0b"/>
    <text x="34" y="21" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">INGENIERÍA DE IMPLEMENTACIÓN INTEGRAL • 3 A 5 DÍAS</text>

    <!-- Step 1: Inventory & AI Training -->
    <g transform="translate(20, 48)">
      <rect width="170" height="74" rx="10" fill="#181432" stroke="rgba(245, 158, 11, 0.3)"/>
      <text x="14" y="22" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">🧠 1. Entrenamiento IA</text>
      <text x="14" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">Carga de inventario &amp; catálogo</text>
      <text x="14" y="50" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Precios, metrajes, amenidades,</text>
      <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">ubicación y fichas técnicas PDF</text>
    </g>

    <!-- Step 2: Sales Funnel & Qualification -->
    <g transform="translate(210, 48)">
      <rect width="170" height="74" rx="10" fill="#181432" stroke="rgba(139, 92, 246, 0.3)"/>
      <text x="14" y="22" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">🎯 2. Embudo de Filtro</text>
      <text x="14" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">Calificación de prospectos</text>
      <text x="14" y="50" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Filtro de crédito vs. contado,</text>
      <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">capacidad de pago y citas reales</text>
    </g>

    <!-- Step 3: Meta Ads & Channel Integration -->
    <g transform="translate(20, 134)">
      <rect width="170" height="74" rx="10" fill="#181432" stroke="rgba(6, 182, 212, 0.3)"/>
      <text x="14" y="22" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">📡 3. Canales &amp; Meta Ads</text>
      <text x="14" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">Conexión de WhatsApp + Tráfico</text>
      <text x="14" y="50" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Canalización de campañas de</text>
      <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Facebook/Instagram a WhatsApp</text>
    </g>

    <!-- Step 4: Team Induction & Training -->
    <g transform="translate(210, 134)">
      <rect width="170" height="74" rx="10" fill="#181432" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="14" y="22" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">👥 4. Capacitación Ventas</text>
      <text x="14" y="38" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600">Taller Práctico de 45 min</text>
      <text x="14" y="50" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Inducción al equipo comercial,</text>
      <text x="14" y="62" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">manejo de app móvil y cierres</text>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(385, 25)">
    <rect width="175" height="34" rx="17" fill="url(#gold-grad)"/>
    <text x="87" y="21" fill="#050508" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">IMPLEMENTACIÓN COMPLETA</text>
  </g>

  <!-- Left Deliverable Pill -->
  <g transform="translate(30, 285)">
    <rect width="140" height="54" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(245, 158, 11, 0.3)"/>
    <text x="16" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">Entregable Llave en Mano</text>
    <text x="16" y="31" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Listo en 3 a 5 días hábiles</text>
    <text x="16" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Garantía de Configuración</text>
  </g>

  <!-- Price Tag -->
  <g transform="translate(425, 280)">
    <rect width="145" height="54" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(245, 158, 11, 0.5)"/>
    <text x="72" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Inversión (Pago Único)</text>
    <text x="72" y="44" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">S/ 1,500.00</text>
  </g>

  <text x="300" y="380" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle" font-weight="600">Servicio de Ingeniería y Consultoría • Pago Único de Configuración</text>
</svg>
