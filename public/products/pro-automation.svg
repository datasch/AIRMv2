<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070914"/>
      <stop offset="50%" stop-color="#0f1026"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
    <linearGradient id="pro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow-4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bg-grad-4)"/>
  <rect width="598" height="398" x="1" y="1" rx="15" fill="none" stroke="rgba(139, 92, 246, 0.35)" stroke-width="2"/>

  <circle cx="160" cy="180" r="120" fill="#3b82f6" opacity="0.12" filter="url(#glow-4)"/>
  <circle cx="450" cy="200" r="110" fill="#8b5cf6" opacity="0.12" filter="url(#glow-4)"/>

  <!-- Kanban & Automation Interface Mockup -->
  <g transform="translate(100, 60)">
    <rect width="400" height="240" rx="16" fill="#0d1120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="400" height="34" rx="16" fill="#070914"/>
    <rect y="20" width="400" height="14" fill="#070914"/>
    <circle cx="20" cy="17" r="4" fill="#ef4444"/>
    <circle cx="32" cy="17" r="4" fill="#f59e0b"/>
    <circle cx="44" cy="17" r="4" fill="#10b981"/>
    <text x="200" y="21" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle" font-weight="700">Pipeline Kanban CRM + Chatbots Autónomos (Ian Studio)</text>

    <!-- Column 1: Leads Nuevos -->
    <g transform="translate(16, 44)">
      <rect width="112" height="180" rx="8" fill="#13192b"/>
      <rect width="112" height="24" rx="8" fill="#1a233d"/>
      <text x="10" y="16" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Nuevos Leads (14)</text>
      
      <!-- Card 1 -->
      <rect x="6" y="32" width="100" height="42" rx="6" fill="#1e293b"/>
      <text x="12" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Jorge Mendoza</text>
      <text x="12" y="60" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">WhatsApp QR • 10m ago</text>

      <!-- Card 2 -->
      <rect x="6" y="80" width="100" height="42" rx="6" fill="#1e293b"/>
      <text x="12" y="95" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Patricia Gómez</text>
      <text x="12" y="108" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Meta Ads • 25m ago</text>
    </g>

    <!-- Column 2: Calificados IA -->
    <g transform="translate(144, 44)">
      <rect width="112" height="180" rx="8" fill="#13192b"/>
      <rect width="112" height="24" rx="8" fill="#201a45"/>
      <text x="10" y="16" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">⚡ Calificados por IA (8)</text>
      
      <!-- Card 1 -->
      <rect x="6" y="32" width="100" height="54" rx="6" fill="#241b52" stroke="rgba(192, 132, 252, 0.4)"/>
      <text x="12" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Renzo Salazar</text>
      <text x="12" y="59" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Crédito Aprobado S/ 450k</text>
      <rect x="12" y="64" width="76" height="14" rx="4" fill="#10b981" opacity="0.3"/>
      <text x="16" y="74" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700">Brochure Enviado ✓</text>
    </g>

    <!-- Column 3: Visita Agendada -->
    <g transform="translate(272, 44)">
      <rect width="112" height="180" rx="8" fill="#13192b"/>
      <rect width="112" height="24" rx="8" fill="#0f2b23"/>
      <text x="10" y="16" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Citas Sala Venta (5)</text>

      <!-- Card 1 -->
      <rect x="6" y="32" width="100" height="50" rx="6" fill="#0b382c" stroke="rgba(52, 211, 153, 0.4)"/>
      <text x="12" y="47" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Daniela Thorne</text>
      <text x="12" y="60" fill="#a7f3d0" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Sábado 11:30 AM</text>
      <text x="12" y="71" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5">Google Calendar Sync</text>
    </g>
  </g>

  <!-- Plan Badge -->
  <g transform="translate(390, 25)">
    <rect width="165" height="34" rx="17" fill="url(#pro-grad)"/>
    <text x="82" y="21" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">PLAN PROFESSIONAL</text>
  </g>

  <!-- Floating Feature Pill -->
  <g transform="translate(30, 285)">
    <rect width="150" height="54" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(139, 92, 246, 0.3)"/>
    <text x="16" y="18" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">Agentes Ilimitados</text>
    <text x="16" y="31" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">WhatsApp + API Oficial + IG</text>
    <text x="16" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">Flujos Automatizados</text>
  </g>

  <!-- Price Tag -->
  <g transform="translate(425, 280)">
    <rect width="145" height="54" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(139, 92, 246, 0.5)"/>
    <text x="72" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Suscripción Pro</text>
    <text x="72" y="44" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">S/ 499.00 <tspan font-size="10" font-weight="500">/mes</tspan></text>
  </g>

  <text x="300" y="380" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle" font-weight="600">Copiloto de IA • CRM Kanban • Canales Ilimitados</text>
</svg>
