<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bg-grad-2)"/>
  <rect width="598" height="398" x="1" y="1" rx="15" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>

  <circle cx="160" cy="160" r="110" fill="#06b6d4" opacity="0.1" filter="url(#glow-2)"/>
  <circle cx="440" cy="240" r="110" fill="#3b82f6" opacity="0.1" filter="url(#glow-2)"/>

  <!-- Desktop App Mockup -->
  <g transform="translate(100, 60)">
    <!-- Main App Container -->
    <rect width="400" height="250" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- App Window Bar -->
    <rect width="400" height="34" rx="16" fill="#060913"/>
    <rect y="20" width="400" height="14" fill="#060913"/>
    <circle cx="20" cy="17" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="17" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="17" r="4.5" fill="#10b981"/>
    <text x="200" y="21" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle" font-weight="600">AIRM CRM Starter • Bandeja Centralizada</text>

    <!-- Sidebar Inboxes -->
    <rect x="0" y="34" width="110" height="216" fill="#090e1c" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <!-- Channels Icons -->
    <g transform="translate(14, 48)">
      <circle cx="12" cy="12" r="10" fill="#25D366" opacity="0.2"/>
      <text x="12" y="15" fill="#25D366" font-size="9" text-anchor="middle" font-weight="700">WA</text>
      <text x="32" y="16" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">WhatsApp QR</text>
    </g>
    <g transform="translate(14, 80)">
      <circle cx="12" cy="12" r="10" fill="#E1306C" opacity="0.2"/>
      <text x="12" y="15" fill="#E1306C" font-size="9" text-anchor="middle" font-weight="700">IG</text>
      <text x="32" y="16" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Instagram DM</text>
    </g>
    <g transform="translate(14, 112)">
      <circle cx="12" cy="12" r="10" fill="#1877F2" opacity="0.2"/>
      <text x="12" y="15" fill="#1877F2" font-size="9" text-anchor="middle" font-weight="700">FB</text>
      <text x="32" y="16" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">Messenger</text>
    </g>

    <!-- Conversation List -->
    <rect x="110" y="34" width="140" height="216" fill="#0b1120" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <!-- Lead 1 -->
    <rect x="116" y="44" width="128" height="42" rx="8" fill="#1e293b" stroke="rgba(6, 182, 212, 0.4)"/>
    <circle cx="132" cy="65" r="10" fill="#06b6d4"/>
    <text x="132" y="69" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">CR</text>
    <text x="148" y="60" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700">Carlos Rivas</text>
    <text x="148" y="73" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Cotizó Dpto 2 Dorm</text>
    
    <!-- Lead 2 -->
    <rect x="116" y="92" width="128" height="42" rx="8" fill="#101726"/>
    <circle cx="132" cy="113" r="10" fill="#64748b"/>
    <text x="132" y="117" fill="#ffffff" font-size="8" font-weight="700" text-anchor="middle">MA</text>
    <text x="148" y="108" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600">María Alva</text>
    <text x="148" y="121" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Solicitó financiamiento</text>

    <!-- Chat View -->
    <rect x="250" y="34" width="150" height="216" fill="#070b14"/>
    <rect x="258" y="55" width="105" height="30" rx="8" fill="#1e293b"/>
    <text x="266" y="68" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">¿Cuál es el precio del</text>
    <text x="266" y="78" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">proyecto en Miraflores?</text>

    <rect x="280" y="95" width="112" height="36" rx="8" fill="#0369a1"/>
    <text x="288" y="108" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600">Desde S/ 380,000.</text>
    <text x="288" y="120" fill="#e0f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="7">¿Deseas agendar visita?</text>
  </g>

  <!-- Plan Badge -->
  <g transform="translate(420, 30)">
    <rect width="135" height="34" rx="17" fill="url(#cyan-blue-grad)"/>
    <text x="67" y="21" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">PLAN STARTER</text>
  </g>

  <!-- Left Float Badge -->
  <g transform="translate(40, 290)">
    <rect width="140" height="42" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="18" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">3 Asesores de Ventas</text>
    <text x="16" y="31" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Bandeja Compartida</text>
  </g>

  <!-- Price Tag -->
  <g transform="translate(420, 290)">
    <rect width="140" height="52" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(6, 182, 212, 0.4)"/>
    <text x="70" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Suscripción Mensual</text>
    <text x="70" y="42" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">S/ 149.00 <tspan font-size="10" font-weight="500">/mes</tspan></text>
  </g>

  <text x="300" y="380" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle" font-weight="600">Software CRM SaaS • Soporte Continuo • Multi-Plataforma</text>
</svg>
