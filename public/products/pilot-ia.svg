<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#100e24"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>
    <linearGradient id="accent-pilot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="wa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bg-grad-1)"/>
  <rect width="598" height="398" x="1" y="1" rx="15" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="2"/>

  <!-- Decorative glow circles -->
  <circle cx="150" cy="180" r="100" fill="#f59e0b" opacity="0.12" filter="url(#glow-1)"/>
  <circle cx="450" cy="220" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow-1)"/>

  <!-- Grid lines subtle -->
  <path d="M50 80 H550 M50 160 H550 M50 240 H550 M50 320 H550" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M120 40 V360 M240 40 V360 M360 40 V360 M480 40 V360" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Smartphone Mockup -->
  <g transform="translate(180, 50)">
    <!-- Phone frame -->
    <rect width="240" height="300" rx="28" fill="#0f111a" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <!-- Phone Notch -->
    <rect x="80" y="8" width="80" height="12" rx="6" fill="#050508"/>
    
    <!-- WhatsApp Header -->
    <rect x="2" y="26" width="236" height="42" fill="url(#wa-grad)"/>
    <circle cx="28" cy="47" r="13" fill="#ffffff" opacity="0.2"/>
    <path d="M24 47 A4 4 0 0 1 32 47" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="28" cy="43" r="3" fill="#ffffff"/>
    <text x="48" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Recepcionista IA</text>
    <text x="48" y="56" fill="#dcfce7" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">En línea • Responde en 2s</text>

    <!-- Chat Message In (Customer) -->
    <rect x="14" y="84" width="165" height="38" rx="10" fill="#1e2230" stroke="rgba(255,255,255,0.05)"/>
    <text x="24" y="99" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">Hola, deseo información</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5">del proyecto y precios.</text>

    <!-- Chat Message Out (AI Response) -->
    <rect x="60" y="132" width="165" height="52" rx="10" fill="#054740" stroke="rgba(37,211,102,0.3)"/>
    <text x="70" y="147" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600">¡Hola! 👋 Te envío brochure:</text>
    <rect x="70" y="153" width="145" height="24" rx="6" fill="#03302b"/>
    <text x="88" y="169" fill="#86efac" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700">📄 Ficha_Tecnica.pdf</text>

    <!-- AI Badge Floating -->
    <g transform="translate(145, 195)">
      <rect width="110" height="32" rx="16" fill="url(#accent-pilot)" filter="url(#glow-1)"/>
      <text x="55" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">⚡ PILOTO 3 DÍAS</text>
    </g>
  </g>

  <!-- Left Pill: Speed -->
  <g transform="translate(35, 110)">
    <rect width="125" height="42" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    <circle cx="24" cy="21" r="11" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="24" y="25" fill="#f59e0b" font-size="12" text-anchor="middle">⚡</text>
    <text x="44" y="18" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">&lt; 3 Segundos</text>
    <text x="44" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Atención 24/7</text>
  </g>

  <!-- Left Pill: Real Estate & Leads -->
  <g transform="translate(35, 210)">
    <rect width="125" height="42" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
    <circle cx="24" cy="21" r="11" fill="rgba(37, 211, 102, 0.2)"/>
    <text x="24" y="25" fill="#25D366" font-size="12" text-anchor="middle">✓</text>
    <text x="44" y="18" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">WhatsApp QR</text>
    <text x="44" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5">Conexión Inmediata</text>
  </g>

  <!-- Right Pill: Pricing -->
  <g transform="translate(440, 150)">
    <rect width="125" height="46" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(245, 158, 11, 0.4)"/>
    <text x="62" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Inversión Piloto</text>
    <text x="62" y="38" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" text-anchor="middle">S/ 18.00</text>
  </g>

  <!-- Footer Tag -->
  <text x="300" y="380" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle" font-weight="600">Servicio Digital • Tokens de IA Cubiertos • Activación Inmediata</text>
</svg>
