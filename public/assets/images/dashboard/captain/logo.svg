<svg width="64" height="64" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GIANTUCCHI AI (IAN) OFFICIAL AVATAR / LOGO -->
  <rect width="512" height="512" rx="128" fill="#090A0F" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#ian_border_grad)" stroke-width="8" stroke-opacity="0.6"/>
  <defs>
    <linearGradient id="ian_border_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="ian_core_glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="256" r="200" fill="url(#ian_core_glow)"/>
  <g transform="translate(256, 256)">
    <!-- CENTRAL SOLID HEXAGON -->
    <polygon
      points="0,-54 46.77,-27 46.77,27 0,54 -46.77,27 -46.77,-27"
      fill="#FFFFFF"
    />

    <!-- 12 RADIAL RAYS AND OUTER NODES -->
    <!-- Angle 0° (Top) -->
    <g>
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 30° -->
    <g transform="rotate(30)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
    <!-- Angle 60° -->
    <g transform="rotate(60)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 90° (Right) -->
    <g transform="rotate(90)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
    <!-- Angle 120° -->
    <g transform="rotate(120)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 150° -->
    <g transform="rotate(150)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
    <!-- Angle 180° (Bottom) -->
    <g transform="rotate(180)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 210° -->
    <g transform="rotate(210)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
    <!-- Angle 240° -->
    <g transform="rotate(240)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 270° (Left) -->
    <g transform="rotate(270)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
    <!-- Angle 300° -->
    <g transform="rotate(300)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95" />
      <circle cx="0" cy="-160" r="10" fill="#A78BFA" />
    </g>
    <!-- Angle 330° -->
    <g transform="rotate(330)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.7" />
      <circle cx="0" cy="-140" r="8" fill="#38BDF8" opacity="0.85" />
    </g>
  </g>
</svg>
