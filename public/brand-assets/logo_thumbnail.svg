<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GIANTUCCHI AI (IAN) OFFICIAL THUMBNAIL -->
  <rect width="512" height="512" rx="128" fill="#000000" />
  <g transform="translate(256, 256)">
    <!-- CENTRAL SOLID HEXAGON -->
    <polygon
      points="0,-54 46.77,-27 46.77,27 0,54 -46.77,27 -46.77,-27"
      fill="#FFFFFF"
    />

    <!-- 12 RADIAL RAYS AND OUTER NODES -->
    <!-- Angle 0° (Top) -->
    <g>
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <circle cx="0" cy="-160" r="9" fill="#FFFFFF" />
    </g>
    <!-- Angle 30° -->
    <g transform="rotate(30)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7" />
    </g>
    <!-- Angle 60° -->
    <g transform="rotate(60)">
      <line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <circle cx="0" cy="-160" r="9" fill="#FFFFFF" />
    </g>
    <!-- Angle 90° (Right) -->
    <g transform="rotate(90)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7" />
    </g>
    <!-- Angle 120° -->
    <g transform="rotate(120)">
