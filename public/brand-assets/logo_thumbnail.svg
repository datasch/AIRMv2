    <g transform="rotate(330)">
      <line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7" />
