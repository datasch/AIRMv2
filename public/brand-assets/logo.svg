      <g><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-72" x2="0" y2="-130" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-160" r="9" fill="#FFFFFF"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-72" x2="0" y2="-115" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/><circle cx="0" cy="-140" r="6.5" fill="#FFFFFF" opacity="0.7"/></g>
