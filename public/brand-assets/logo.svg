<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AIRM (GIANTUCCHI AI) LIGHT LOGO -->
  <g transform="translate(15, 15)">
    <rect width="120" height="120" rx="30" fill="#000000" />
