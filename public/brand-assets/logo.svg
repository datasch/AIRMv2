  <rect x="330" y="44" width="70" height="24" rx="6" fill="#000000" fill-opacity="0.08" />
  <text x="342" y="60" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#000000">
