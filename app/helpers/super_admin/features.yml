# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Premium Features ------- #
saml:
  name: 'SAML SSO'
  description: 'Configuración para controlar la disponibilidad del inicio de sesión único SAML.'
  enabled: <%= ChatwootApp.enterprise? %>
  icon: 'icon-lock-line'
  config_key: 'saml'
  enterprise: true
custom_branding:
  name: 'Personalización de Marca'
  description: 'Aplique su propia identidad y marca a esta instalación de AIRM.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-paint-brush-line'
  config_key: 'custom_branding'
  enterprise: true
agent_capacity:
  name: 'Capacidad de Agentes'
  description: 'Establezca límites para la asignación automática de conversaciones a sus agentes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-hourglass-line'
  enterprise: true
audit_logs:
  name: 'Registros de Auditoría'
  description: 'Rastree y supervise todas las actividades de las cuentas con registros detallados.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-menu-search-line'
  enterprise: true
disable_branding:
  name: 'Desactivar Marca de Pie'
  description: 'Elimine las marcas de agua en el widget de chat y en los correos externos.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-sailbot-fill'
  enterprise: true
voice_calls:
  name: 'Llamadas de Voz'
  description: 'Habilite capacidades de llamadas de voz para sus agentes y clientes.'
  enabled: <%= (ChatwootHub.pricing_plan != 'community') %>
  icon: 'icon-voice-line'
  enterprise: true

# ------- Product Features ------- #
help_center:
  name: 'Centro de Ayuda'
  description: 'Permita que los agentes creen artículos y los publiquen en un portal de autoservicio.'
  enabled: true
  icon: 'icon-book-2-line'
captain:
  name: 'Captain AI'
  description: 'Habilite conversaciones y respuestas potenciadas por Inteligencia Artificial.'
  enabled: true
  icon: 'icon-captain'
  config_key: 'captain'

# ------- Communication Channels ------- #
live_chat:
  name: 'Chat en Vivo'
  description: 'Mejore la experiencia de sus clientes con un widget de chat interactivo en su sitio web.'
  enabled: true
  icon: 'icon-chat-smile-3-line'
email:
  name: 'Correo Electrónico'
  description: 'Gestione las interacciones por email de sus clientes directamente desde AIRM.'
  enabled: true
  icon: 'icon-mail-send-fill'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'Gestione interacciones por mensajes de texto SMS con sus clientes.'
  enabled: true
  icon: 'icon-message-line'
messenger:
  name: 'Messenger'
  description: 'Conecte y atienda a sus clientes a través de Facebook & Instagram Messenger.'
  enabled: true
  icon: 'icon-messenger-line'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Gestione mensajes directos y comentarios de Instagram en tiempo real.'
  enabled: true
  icon: 'icon-instagram'
  config_key: 'instagram'
tiktok:
  name: 'TikTok'
  description: 'Conéctese e interactúe con su audiencia de TikTok desde una sola bandeja.'
  enabled: true
  icon: 'icon-tiktok'
  config_key: 'tiktok'
whatsapp:
  name: 'WhatsApp Cloud API'
  description: 'Gestione interacciones oficiales de WhatsApp Business API desde AIRM.'
  enabled: true
  icon: 'icon-whatsapp-line'
  config_key: 'whatsapp'
telegram:
  name: 'Telegram'
  description: 'Atienda consultas de clientes y grupos a través de bots de Telegram.'
  enabled: true
  icon: 'icon-telegram-line'
line:
  name: 'Line'
  description: 'Gestione interacciones con clientes a través del canal Line.'
  enabled: true
  icon: 'icon-line-line'

# ------- OAuth & Authentication ------- #
google:
  name: 'Google OAuth'
  description: 'Configuración para habilitar inicio de sesión y sincronización con Google.'
  enabled: true
  icon: 'icon-google'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Configuración para sincronización de correo e inicio de sesión con Microsoft 365.'
  enabled: true
  icon: 'icon-microsoft'
  config_key: 'microsoft'

# ------- Third-party Integrations ------- #
linear:
  name: 'Linear'
  description: 'Configuración para vincular problemas y tickets de soporte con Linear.'
  enabled: true
  icon: 'icon-linear'
  config_key: 'linear'
notion:
  name: 'Notion'
  description: 'Configuración para sincronizar bases de datos y conocimiento con Notion.'
  enabled: true
  icon: 'icon-notion'
  config_key: 'notion'
slack:
  name: 'Slack'
  description: 'Configuración para recibir notificaciones y responder chats desde canales de Slack.'
  enabled: true
  icon: 'icon-slack'
  config_key: 'slack'
whatsapp_embedded:
  name: 'WhatsApp Embedded Signup'
  description: 'Configuración del registro integrado de WhatsApp Business para clientes.'
  enabled: true
  icon: 'icon-whatsapp-line'
  config_key: 'whatsapp_embedded'
shopify:
  name: 'Shopify'
  description: 'Configuración para integrar tiendas, pedidos e información de clientes de Shopify.'
  enabled: true
  icon: 'icon-shopify'
  config_key: 'shopify'
